[project]
name = "daily-reporter"
version = "0.1.0"
description = "Publish a daily report of storage service activity to Slack"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.32",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]
