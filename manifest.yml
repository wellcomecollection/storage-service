# Backplane (backplane/v1) description of this repository, gathered into
# https://github.com/wellcomecollection/catalog, which names the owning team
# for this repository wherever it appears (for example in the security digests).
apiVersion: backplane/v1
kind: System
metadata:
  name: storage-service
  description: Stores, verifies and replicates our digital collections and preservation files
  annotations:
    github.com/project-slug: wellcomecollection/storage-service
spec:
  owner: team:digital-platform
---
apiVersion: backplane/v1
kind: Resource
metadata:
  name: storage-replica-primary
  description: S3 bucket wellcomecollection-storage, the primary replica, read directly by iiif-builder, the METS transformer and DLCS
spec:
  type: bucket
  owner: team:digital-platform
  system: system:storage-service
